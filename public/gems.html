<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MAFYA - لعبة الجواهر</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Orbitron:wght@700;900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root{
  --primary:#050B2E;
  --accent:#A8E600;
  --accent2:#7CB800;
  --border:rgba(168,230,0,.28);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Almarai',sans-serif}
html,body{width:100%;min-height:100%;background:var(--primary);color:#fff;overflow-x:hidden}
body{
  min-height:100dvh;
  background:var(--primary) url('back.gif') no-repeat center center/cover;
  background-attachment:fixed;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding: calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));
  position:relative;
}
.overlay{position:fixed;inset:0;background:radial-gradient(800px 500px at 50% 20%,rgba(168,230,0,.14),transparent 60%),linear-gradient(180deg,rgba(5,11,46,.35),rgba(5,11,46,.75));z-index:0;pointer-events:none}
.grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(168,230,0,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(168,230,0,.04) 1px,transparent 1px);background-size:40px 40px;z-index:0;pointer-events:none}

.wrap{position:relative;z-index:2;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 12px;border-radius:999px;
  background:rgba(5,11,46,.55);border:1px solid var(--border);
  color:#fff;font-weight:800;font-size:12px;text-decoration:none;
}
.title{
  font-family:'Cinzel','Orbitron',sans-serif;
  font-weight:900;font-size:18px;letter-spacing:.5px;
  text-shadow:0 0 14px rgba(168,230,0,.45);
}

.card{
  border-radius:24px;
  border:1px solid rgba(168,230,0,.35);
  background:rgba(5,11,46,.55);
  backdrop-filter:blur(16px);
  padding:18px;
  box-shadow:0 20px 55px rgba(0,0,0,.55),0 0 34px rgba(168,230,0,.14);
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,45px);
  grid-auto-rows:45px;
  gap:10px;
  justify-content:center;
  margin-bottom:16px;
}
.cell{
  width:45px;height:45px;border-radius:20px;
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(5,11,46,.75));
  border:1px solid rgba(168,230,0,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 6px 16px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:transparent;
  transition:transform .35s ease, box-shadow .35s ease, background .35s ease;
}
.cell.gem{
  color:var(--accent);
  background:linear-gradient(160deg,rgba(168,230,0,.22),rgba(5,11,46,.7));
  border-color:rgba(168,230,0,.7);
  box-shadow:0 0 20px rgba(168,230,0,.45),inset 0 0 12px rgba(168,230,0,.2);
  transform:scale(1.06);
  text-shadow:0 0 12px rgba(168,230,0,.8);
}

.field{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-radius:16px;
  background:rgba(5,11,46,.5);
  border:1px solid var(--border);
  transition:border-color .3s, box-shadow .3s;
  margin-bottom:12px;
}
.field:focus-within{border-color:rgba(168,230,0,.65);box-shadow:0 0 20px rgba(168,230,0,.22)}
.ic{
  width:40px;height:40px;flex:0 0 40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(168,230,0,.16);border:1px solid rgba(168,230,0,.3);
  color:var(--accent);font-size:16px;
}
.input{
  width:100%;background:transparent;border:0;outline:0;color:#fff;
  font-size:16px;font-family:'Orbitron',monospace;direction:ltr;
}
.input::placeholder{color:rgba(255,255,255,.45);font-family:'Almarai',sans-serif;font-size:14px}

.actions{display:flex;gap:10px}
.btn{
  flex:1;border:0;cursor:pointer;
  padding:12px 14px;border-radius:14px;font-weight:900;font-size:14px;
  transition:transform .12s ease, filter .12s ease;
}
.btn:active{transform:scale(.98)}
.btn-primary{
  color:#111;background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 10px 28px rgba(168,230,0,.3);border:1px solid rgba(168,230,0,.6);
}
.btn-ghost{color:#fff;background:rgba(5,11,46,.55);border:1px solid var(--border)}

.swal2-popup.mafya-swal{
  border-radius:20px!important;
  border:1px solid rgba(168,230,0,.45)!important;
  background:linear-gradient(180deg,rgba(5,11,46,.96),rgba(5,11,46,.99))!important;
  color:#fff!important;
}
.swal2-confirm.mafya-swal-confirm{
  background:linear-gradient(45deg,var(--accent),var(--accent2))!important;
  color:#000!important;border-radius:12px!important;font-weight:900!important;
}
</style>
</head>
<body>
<div class="overlay"></div>
<div class="grid-bg"></div>

<div class="wrap">
  <div class="header">
    <a class="back-btn" href="verification.html?games=1"><i class="fas fa-arrow-right"></i> رجوع</a>
    <div class="title">لعبة الجواهر 💎</div>
    <span style="width:1px"></span>
  </div>

  <div class="card">
    <div class="grid" id="grid"></div>

    <div class="field">
      <div class="ic"><i class="fas fa-gem"></i></div>
      <input class="input" id="gemCount" type="number" min="1" max="25" placeholder="عدد الألماس ؟">
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="startBtn"><i class="fas fa-play"></i> بدء</button>
      <button class="btn btn-ghost" id="resetBtn"><i class="fas fa-redo"></i> إعادة بدء</button>
    </div>
  </div>
</div>

<script>
const TOTAL = 25;
const grid = document.getElementById('grid');
const cells = [];

for(let i = 0; i < TOTAL; i++){
  const c = document.createElement('div');
  c.className = 'cell';
  c.innerHTML = '<i class="fas fa-gem"></i>';
  grid.appendChild(c);
  cells.push(c);
}

function reset(){
  cells.forEach(c => c.classList.remove('gem'));
}

function alertMsg(text){
  Swal.fire({
    title: 'تنبيه',
    text,
    icon: 'warning',
    confirmButtonText: 'حسناً',
    customClass: { popup: 'mafya-swal', confirmButton: 'mafya-swal-confirm' }
  });
}

document.getElementById('startBtn').addEventListener('click', () => {
  const n = parseInt(document.getElementById('gemCount').value, 10);
  if(!Number.isFinite(n) || n < 1 || n > TOTAL){
    alertMsg('اكتب رقم من 1 إلى 25');
    return;
  }
  reset();
  const picked = new Set();
  while(picked.size < n){
    picked.add(Math.floor(Math.random() * TOTAL));
  }
  [...picked].forEach((idx, i) => {
    setTimeout(() => cells[idx].classList.add('gem'), i * 130);
  });
});

document.getElementById('resetBtn').addEventListener('click', () => {
  reset();
  document.getElementById('gemCount').value = '';
});
</script>
</body>
</html>
