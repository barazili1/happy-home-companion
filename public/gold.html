<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MAFYA - لعبة الذهب</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#050B2E;
  --accent:#A8E600;
  --accent2:#7CB800;
  --border:rgba(168,230,0,.28);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Almarai',sans-serif}
html,body{width:100%;min-height:100%;background:var(--primary);color:#fff;overflow-x:hidden}
body{
  min-height:100dvh;
  background:var(--primary) url('back.gif') no-repeat center center/cover;
  background-attachment:fixed;
  display:flex;flex-direction:column;align-items:center;
  padding: calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));
  position:relative;
}
.overlay{position:fixed;inset:0;background:linear-gradient(180deg,rgba(5,11,46,.35),rgba(5,11,46,.75));z-index:0;pointer-events:none}
.grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(168,230,0,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(168,230,0,.04) 1px,transparent 1px);background-size:40px 40px;z-index:0;pointer-events:none}

.wrap{position:relative;z-index:2;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:16px}

.topbar{
  width:100%;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;
  border-radius:18px;
  border:1px solid var(--border);
  background:rgba(5,11,46,.6);
  backdrop-filter:blur(14px);
  box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 24px rgba(168,230,0,.10);
}
.logo-frame{
  width:44px;height:44px;border-radius:50%;
  border:2px solid rgba(168,230,0,.55);
  box-shadow:0 0 16px rgba(168,230,0,.35);
  overflow:hidden;flex-shrink:0;
  background:#050B2E;
}
.logo-frame img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.topbar-title{
  font-family:'Cinzel',sans-serif;font-weight:900;font-size:17px;letter-spacing:.5px;
  color:#fff;text-shadow:0 0 14px rgba(168,230,0,.45);
  flex:1;text-align:center;
}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 12px;border-radius:999px;
  background:rgba(5,11,46,.55);border:1px solid var(--border);
  color:#fff;font-weight:800;font-size:12px;text-decoration:none;
}

.card{
  width:100%;
  border-radius:20px;
  border:1px solid rgba(168,230,0,.35);
  background:rgba(5,11,46,.55);
  backdrop-filter:blur(14px);
  padding:18px 16px;
  box-shadow:0 16px 45px rgba(0,0,0,.5),0 0 30px rgba(168,230,0,.12);
  display:flex;flex-direction:column;align-items:center;gap:16px;
}

.multi-row{display:flex;gap:14px;justify-content:center;width:100%}
.multi-box{
  flex:1;max-width:160px;
  padding:16px 0;
  border-radius:16px;
  border:1px solid var(--border);
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(5,11,46,.8));
  font-family:'Cinzel',sans-serif;font-weight:900;font-size:24px;color:#fff;
  text-align:center;cursor:pointer;
  transition:transform .15s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
  user-select:none;
}
.multi-box:hover{transform:translateY(-2px)}
.multi-box.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#111;border-color:rgba(168,230,0,.7);
  box-shadow:0 10px 28px rgba(168,230,0,.35);
}

.slots{
  display:flex;gap:12px;justify-content:center;flex-wrap:wrap;
  min-height:50px;
}
.slot{
  width:150px;height:50px;
  border-radius:12px;
  border:1px solid rgba(168,230,0,.35);
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(5,11,46,.8));
  box-shadow:inset 0 0 10px rgba(0,0,0,.35),0 0 12px rgba(168,230,0,.08);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  transition:transform .3s ease, box-shadow .3s ease;
}
.slot.revealed{transform:scale(1.04);box-shadow:0 0 18px rgba(255,200,0,.45);border-color:rgba(255,200,0,.6)}
.slot img{width:44px;height:44px;object-fit:contain;opacity:0;transition:opacity .35s ease}
.slot.revealed img{opacity:1}

.actions{display:flex;gap:10px;width:100%}
.btn{
  flex:1;border:0;cursor:pointer;
  padding:12px 14px;border-radius:14px;font-weight:900;font-size:14px;
  transition:transform .12s ease, filter .12s ease;
}
.btn:active{transform:scale(.98)}
.btn-primary{
  color:#111;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 10px 28px rgba(168,230,0,.3);
  border:1px solid rgba(168,230,0,.6);
}
.btn-ghost{
  color:#fff;background:rgba(5,11,46,.55);border:1px solid var(--border);
}
</style>
</head>
<body>
<div class="overlay"></div>
<div class="grid-bg"></div>

<div class="wrap">
  <div class="topbar">
    <a class="back-btn" href="verification.html?games=1"><i class="fas fa-arrow-right"></i> رجوع</a>
    <div class="topbar-title">لعبة الذهب 🪙</div>
    <div class="logo-frame"><img src="logo.png" alt="MAFYA"></div>
  </div>

  <div class="card">
    <div class="multi-row">
      <button type="button" class="multi-box" data-count="2">X2</button>
      <button type="button" class="multi-box" data-count="3">X3</button>
    </div>

    <div class="slots" id="slots"></div>

    <div class="actions">
      <button type="button" class="btn btn-primary" id="startBtn">بدء</button>
      <button type="button" class="btn btn-ghost" id="resetBtn">إعادة بدء</button>
    </div>
  </div>
</div>

<script>
(function(){
  const slotsEl = document.getElementById('slots');
  const multiBoxes = document.querySelectorAll('.multi-box');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  let count = 0;

  function renderSlots(){
    slotsEl.innerHTML = '';
    for (let i = 0; i < count; i++){
      const s = document.createElement('div');
      s.className = 'slot';
      s.innerHTML = '<img src="img/treasure.png" alt="كنز">';
      slotsEl.appendChild(s);
    }
  }

  multiBoxes.forEach(box => {
    box.addEventListener('click', () => {
      multiBoxes.forEach(b => b.classList.remove('active'));
      box.classList.add('active');
      count = parseInt(box.dataset.count, 10);
      renderSlots();
    });
  });

  startBtn.addEventListener('click', () => {
    if (!count) return;
    const slots = slotsEl.querySelectorAll('.slot');
    slots.forEach(s => s.classList.remove('revealed'));
    slots.forEach((s, i) => {
      setTimeout(() => s.classList.add('revealed'), 300 * (i + 1));
    });
  });

  resetBtn.addEventListener('click', () => {
    slotsEl.querySelectorAll('.slot').forEach(s => s.classList.remove('revealed'));
  });
})();
</script>
</body>
</html>
