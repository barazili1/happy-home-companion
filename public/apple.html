<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MAFYA - لعبة التفاحة</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Orbitron:wght@700;900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#050B2E;
  --accent:#A8E600;
  --accent2:#7CB800;
  --border:rgba(168,230,0,.28);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Almarai',sans-serif}
html,body{width:100%;min-height:100%;background:var(--primary);color:#fff;overflow-x:hidden}
body{
  min-height:100dvh;
  background:var(--primary) url('back.gif') no-repeat center center/cover;
  background-attachment:fixed;
  display:flex;flex-direction:column;align-items:center;
  padding: calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));
  position:relative;
}
.overlay{position:fixed;inset:0;background:linear-gradient(180deg,rgba(5,11,46,.35),rgba(5,11,46,.75));z-index:0;pointer-events:none}
.grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(168,230,0,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(168,230,0,.04) 1px,transparent 1px);background-size:40px 40px;z-index:0;pointer-events:none}

.wrap{position:relative;z-index:2;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:16px}
.header{
  width:100%;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 12px;border-radius:999px;
  background:rgba(5,11,46,.55);border:1px solid var(--border);
  color:#fff;font-weight:800;font-size:12px;text-decoration:none;
}
.title{
  font-family:'Cinzel','Orbitron',sans-serif;
  font-weight:900;letter-spacing:.5px;font-size:18px;
  color:#fff;text-shadow:0 0 14px rgba(168,230,0,.45);
}

.card{
  width:100%;
  border-radius:20px;
  border:1px solid rgba(168,230,0,.35);
  background:rgba(5,11,46,.55);
  backdrop-filter:blur(14px);
  padding:16px;
  box-shadow:0 16px 45px rgba(0,0,0,.5),0 0 30px rgba(168,230,0,.12);
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,40px);
  grid-auto-rows:40px;
  gap:8px;
  justify-content:center;
  margin:6px auto 14px;
}
.cell{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(5,11,46,.8));
  border:1px solid rgba(168,230,0,.35);
  box-shadow:inset 0 0 8px rgba(0,0,0,.35),0 0 10px rgba(168,230,0,.08);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
  transition:transform .3s ease, box-shadow .3s ease;
}
.cell.revealed{transform:scale(1.06);box-shadow:0 0 14px rgba(168,230,0,.35)}
.cell img{width:78%;height:78%;object-fit:contain;opacity:0;transition:opacity .3s ease}
.cell.revealed img{opacity:1}

.actions{display:flex;gap:10px;margin-top:6px}
.btn{
  flex:1;border:0;cursor:pointer;
  padding:12px 14px;border-radius:14px;font-weight:900;font-size:14px;
  transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;
}
.btn:active{transform:scale(.98)}
.btn-primary{
  color:#111;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 10px 28px rgba(168,230,0,.3);
  border:1px solid rgba(168,230,0,.6);
}
.btn-ghost{
  color:#fff;background:rgba(5,11,46,.55);border:1px solid var(--border);
}
</style>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="overlay"></div>
<div class="grid-bg"></div>

<div class="wrap">
  <div class="header">
    <a class="back-btn" href="verification.html?games=1"><i class="fas fa-arrow-right"></i> رجوع</a>
    <div class="title">لعبة التفاحة 🍎</div>
    <span style="width:1px"></span>
  </div>

  <div class="card">
    <div class="grid" id="grid"></div>
    <div class="actions">
      <button class="btn btn-primary" id="startBtn"><i class="fas fa-play"></i> بدء</button>
      <button class="btn btn-ghost" id="resetBtn"><i class="fas fa-redo"></i> إعادة بدء</button>
    </div>
  </div>
</div>

<script>
const ROWS = 10, COLS = 5;
const ALLOWED_ID = '1729018123';
const FB_BASE = 'https://x-men-256cc-default-rtdb.firebaseio.com/m11';
const APPLE_IMG = 'img/apple.png';
const ROTTEN_IMG = 'img/rotten.png';

const userId = (localStorage.getItem('mafya_user_id') || localStorage.getItem('pendingAutoFillID') || '').trim();
const isAllowed = userId === ALLOWED_ID;

const grid = document.getElementById('grid');
const cells = [];

function buildGrid(){
  grid.innerHTML = '';
  cells.length = 0;
  for(let i = 0; i < ROWS * COLS; i++){
    const c = document.createElement('div');
    c.className = 'cell';
    const img = document.createElement('img');
    c.appendChild(img);
    grid.appendChild(c);
    cells.push({ el: c, img });
  }
}

// m1 = التفاحة أسفل اليسار، والصفوف تُعد من الأسفل للأعلى
function domIndexFor(n){
  const r = Math.floor((n - 1) / COLS);   // رقم الصف من الأسفل
  const p = ((n - 1) % COLS) + 1;         // الترتيب من اليسار
  return (ROWS - 1 - r) * COLS + (COLS - p);
}

function reset(){
  cells.forEach(({el, img}) => {
    el.classList.remove('revealed');
    img.removeAttribute('src');
  });
}

function revealValues(values){
  reset();
  const order = [];
  for(let n = 1; n <= ROWS * COLS; n++) order.push(n);
  let i = 0;
  const step = () => {
    if(i >= order.length) return;
    const n = order[i];
    const { el, img } = cells[domIndexFor(n)];
    img.src = values['m' + n] === '1' ? ROTTEN_IMG : APPLE_IMG;
    el.classList.add('revealed');
    i++;
    setTimeout(step, 55);
  };
  step();
}

function randomValues(){
  // كل صف وعدد التفاح الفاسد المطلوب فيه
  const plan = [1,1,1,1, 2,2,2, 3,3, 4];
  const values = {};
  for(let r = 0; r < ROWS; r++){
    const bad = new Set();
    while(bad.size < plan[r]) bad.add(Math.floor(Math.random() * COLS));
    for(let p = 0; p < COLS; p++){
      const n = r * COLS + p + 1;
      values['m' + n] = bad.has(p) ? '1' : '0';
    }
  }
  return values;
}

function toFirebasePayload(values){
  const payload = {};
  Object.keys(values).forEach(k => { payload[k] = { [k]: values[k] }; });
  return payload;
}

function flatten(data){
  const values = {};
  for(let n = 1; n <= ROWS * COLS; n++){
    const key = 'm' + n;
    const node = data ? data[key] : null;
    let v = '0';
    if (node && typeof node === 'object') v = String(node[key] ?? '0');
    else if (node !== null && node !== undefined) v = String(node);
    values[key] = v === '1' ? '1' : '0';
  }
  return values;
}

function alertError(){
  Swal.fire({
    title: 'خطأ',
    text: 'هذا الحساب غير مفعل، لا يمكن عرض التوقعات',
    icon: 'error',
    confirmButtonText: 'حسناً',
    customClass: {
      popup: 'mafya-swal',
      title: 'mafya-swal-title',
      htmlContainer: 'mafya-swal-html',
      confirmButton: 'mafya-swal-confirm'
    }
  });
}

async function fetchValues(){
  const res = await fetch(FB_BASE + '.json?t=' + Date.now(), { cache: 'no-store' });
  return flatten(await res.json());
}

async function saveValues(values){
  await fetch(FB_BASE + '.json', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(toFirebasePayload(values))
  });
}

buildGrid();

let lastSignature = null;

async function start(){
  if(!isAllowed){
    alertError();
    return;
  }
  try {
    const values = await fetchValues();
    lastSignature = JSON.stringify(values);
    revealValues(values);
  } catch(e){
    console.error(e);
    alertError();
  }
}

async function restart(){
  if(!isAllowed){
    reset();
    alertError();
    return;
  }
  const values = randomValues();
  try {
    await saveValues(values);
  } catch(e){ console.error(e); }
  lastSignature = JSON.stringify(values);
  revealValues(values);
}

// تحديث تلقائي عند تغيّر التوقعات في الفايربيس
if (isAllowed){
  setInterval(async () => {
    try {
      const values = await fetchValues();
      const sig = JSON.stringify(values);
      if (sig !== lastSignature){
        lastSignature = sig;
        revealValues(values);
      }
    } catch(e){ /* تجاهل */ }
  }, 2000);
}

document.getElementById('startBtn').addEventListener('click', start);
document.getElementById('resetBtn').addEventListener('click', restart);
</script>
</body>
</html>
